name: DUS Ankuenfte Clean Table

on:
  schedule:
    # GitHub-Cron läuft immer in UTC. Damit Sommer- und Winterzeit stimmen,
    # startet der Job alle 30 Minuten von 03:00 bis 22:30 UTC.
    # Das Skript prüft selbst, ob es lokal (Europe/Berlin) zwischen 05:30 und 23:30 ist.
    - cron: '0,30 3-22 * * *'

  workflow_dispatch:

concurrency:
  group: dus-scraper
  cancel-in-progress: false

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scraper ausführen
        env:
          AIRLABS_API_KEY: ${{ secrets.AIRLABS_API_KEY }}
        run: |
          python scraper.py

      - name: Änderungen committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache.json
          if git diff --staged --quiet; then
            echo "Keine Änderungen an cache.json."
          else
            git commit -m "Update cache.json (AirLabs)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
