name: DUS Ankuenfte Clean Table

on:
  schedule:
    # Alle 30 Minuten von 07:00 bis 23:30 Uhr (05:00 bis 21:30 UTC)
    - cron: '*/30 5-21 * * *'

  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip

      - name: Scraper ausführen
        env:
          AIRLABS_API_KEY: ${{ secrets.AIRLABS_API_KEY }}
        run: |
          python scraper.py

      - name: Änderungen committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html cache.json
          git diff --quiet && \
          git diff --staged --quiet || \
          (
            git commit -m "Update DUS Ankünfte (AirLabs)" &&
            git push
          )
