name: DUS Ankuenfte Clean Table

on:
  # Erlaubt den externen Start über cron-job.org via GitHub API (Repository Dispatch oder Workflow Dispatch)
  workflow_dispatch:
  repository_dispatch:
    types: [run-scraper]

concurrency:
  group: dus-scraper
  cancel-in-progress: false

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scraper ausführen und ins Daten-Repo pushen
        env:
          DUSFLUGDATENKEY: ${{ secrets.DUSFLUGDATENKEY }}
        run: |
          python scraper.py
